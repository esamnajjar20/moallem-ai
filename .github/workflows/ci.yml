name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12.16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_DB: moallem_test
          POSTGRES_USER: moallem
          POSTGRES_PASSWORD: moallem-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moallem -d moallem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOALLEM_DATABASE_URL: postgresql+psycopg://moallem:moallem-ci-only@localhost:5432/moallem_test
      MOALLEM_TEST_DATABASE_URL: postgresql+psycopg://moallem:moallem-ci-only@localhost:5432/moallem_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          python-version: 3.12.16
          enable-cache: true

      - name: Verify toolchain and lockfile
        run: |
          test "$(cat .python-version)" = "3.12.16"
          uv --version
          uv python install 3.12.16
          uv sync --locked --python 3.12.16

      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Strict type check
        run: uv run --locked mypy

      - name: Apply database migrations
        run: uv run --locked alembic upgrade head

      - name: Unit and API tests
        run: uv run --locked pytest -ra

      - name: Build wheel
        run: uv build

      - name: Dependency vulnerability audit
        run: uv run --locked pip-audit

  mobile-android:
    name: Flutter analyze, tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: false

      - name: Verify committed native runners and lockfile
        working-directory: .
        run: ./scripts/check_mobile_prerequisites.sh

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter static analysis
        run: flutter analyze --fatal-infos

      - name: Flutter tests
        run: flutter test --reporter expanded

      - name: Build Android APK
        run: flutter build apk --debug

  mobile-ios:
    name: Flutter iOS build (unsigned)
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: false

      - name: Verify committed native runners and lockfile
        working-directory: .
        run: ./scripts/check_mobile_prerequisites.sh

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Dart format, analysis and tests
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
