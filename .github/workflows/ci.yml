name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: pin third-party actions to full commit SHAs before the first real release (ADR-025).

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      # Fails if uv.lock is missing or out of date: lockfile must be committed (P1-01).
      - run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: "Type check (ADR-016 provisional, mypy strict)"
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest
      - name: Build wheel
        run: uv build
      - name: Dependency CVE scan
        run: uv run pip-audit

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # TODO(P1-01): pin an exact Flutter version here once chosen; "stable" alone is not reproducible.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Fails if pubspec.lock is missing or would change: lockfile must be committed (P1-01).
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Debug build (runs once platform folders are committed)
        if: ${{ hashFiles('mobile/android/**') != '' }}
        run: flutter build apk --debug

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
