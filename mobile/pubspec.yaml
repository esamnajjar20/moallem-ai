name: moallem_mobile
description: Moallem AI teacher app (P1 foundation shell).
publish_to: "none"
version: 0.0.1+1

environment:
  # Flutter is pinned separately in .flutter-version and pubspec's flutter constraint.
  sdk: ">=3.8.0 <4.0.0"
  flutter: "3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ADR-015 remains provisional; P1 only needs a testable provider container.
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
