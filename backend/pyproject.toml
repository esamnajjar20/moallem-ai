[project]
name = "moallem"
version = "0.0.1"
description = "Moallem AI backend (API + Worker). Phase P1 foundation skeleton."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "types-pyyaml",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moallem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/rsa_keys.py" = ["E501"]

# ADR-016 (PROVISIONAL): mypy --strict. See docs/adr/ADR-016-python-type-checker.md
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["moallem"]
warn_unreachable = true
